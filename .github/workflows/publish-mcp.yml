name: Publish to MCP Registry

# Publishes server.json to the Official MCP Registry (registry.modelcontextprotocol.io),
# which auto-propagates to the GitHub MCP Registry and PulseMCP.
#
# Auth is GitHub OIDC — it proves ownership of the io.github.RightOnPar-LLC
# namespace with NO secret and NO interactive login. This job does NOT run on
# its own: it fires only when you push a v* tag or click "Run workflow" in the
# Actions tab. That trigger is the publish signature.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# CI-STANDARD.md §1 — DEPLOY-CLASS: this pushes server.json to the Official MCP
# Registry, state that outlives the run and propagates onward to the GitHub MCP
# Registry and PulseMCP. cancel-in-progress is deliberately FALSE: killing this
# mid-publish is the silent half-done failure the standard warns about. The
# group only makes a second run QUEUE — a tag push racing a manual dispatch
# can no longer double-publish concurrently.
concurrency:
  group: publish-mcp-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # CI-STANDARD.md §2. Measured 2026-08-19: n=5 successful runs, p95 0.3m,
    # max 0.3m -> formula says 5. Set to 15 on purpose: on a publish job a
    # timeout that fires early is itself the destructive outcome (a tag
    # published halfway), so the generous side is the safe side. This exists
    # only to stop a wedged curl/OIDC handshake from billing 6 hours.
    timeout-minutes: 15
    permissions:
      id-token: write   # required for OIDC auth to the registry
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Distribution gate (a red gate blocks the publish)
        run: node tools/distribution-gate.mjs

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate (GitHub OIDC — proves the io.github.RightOnPar-LLC namespace)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP Registry
        run: ./mcp-publisher publish
